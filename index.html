<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicación Chicha</title>
<link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --primary: #2e7d32;
      --text: #333333;
      --header-bg: #1a237e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px 0;
      color: var(--header-bg);
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .header-calendar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .nav-btn {
      background: #e8eaf6;
      color: var(--header-bg);
      border: none;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:active {
      background: #c5cae9;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .day-name {
      font-size: 0.75rem;
      color: #777;
      font-weight: 600;
      padding-bottom: 4px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #f0f0f0;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .day.empty {
      background: transparent;
      cursor: default;
    }

    .day.today {
      border: 2px solid var(--header-bg);
      font-weight: bold;
    }

    .day.taken {
      background: var(--primary);
      color: white;
    }

    .day.taken::after {
      content: " ✓";
      font-size: 0.7rem;
    }

    .day.future {
      opacity: 0.35;
      background: #e0e0e0;
      cursor: not-allowed;
    }

    .alarm-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="time"] {
      font-size: 1rem;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button.btn {
      background: var(--header-bg);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .status {
      font-size: 0.85rem;
      margin-top: 8px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Medicación Chicha</h1>
    <span style="font-size: 0.85rem; color: #666;">Seguimiento Diario</span>
  </header>

  <div class="card">
    <div class="header-calendar">
      <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
      <span id="monthLabel"></span>
      <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
    </div>
    <div class="grid">
      <div class="day-name">Lu</div>
      <div class="day-name">Ma</div>
      <div class="day-name">Mi</div>
      <div class="day-name">Ju</div>
      <div class="day-name">Vi</div>
      <div class="day-name">Sá</div>
      <div class="day-name">Do</div>
    </div>
    <div class="grid" id="calendarGrid" style="margin-top: 6px;"></div>
  </div>

  <div class="card alarm-section">
    <div>
      <div style="font-weight: 600; font-size: 0.9rem;">Hora de Recordatorio</div>
      <div class="status" id="alarmStatus">Sin configurar</div>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <input type="time" id="alarmTime" value="20:00">
      <button class="btn" onclick="saveAlarm()">Guardar</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'chicha_meds_tracker';
  const ALARM_KEY = 'chicha_meds_alarm';

  let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  let alarmTime = localStorage.getItem(ALARM_KEY) || "20:00";

  // Control de la fecha visualizada en el calendario
  let currentDate = new Date();
  let displayedYear = currentDate.getFullYear();
  let displayedMonth = currentDate.getMonth();

  document.getElementById('alarmTime').value = alarmTime;

  function initCalendar() {
    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    document.getElementById('monthLabel').innerText = `${monthNames[displayedMonth]} ${displayedYear}`;

    const firstDay = new Date(displayedYear, displayedMonth, 1);
    const lastDay = new Date(displayedYear, displayedMonth + 1, 0);

    // Ajuste para comenzar en Lunes (0 = Lu, 6 = Do)
    let startingDay = firstDay.getDay() - 1;
    if (startingDay === -1) startingDay = 6;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    // Celdas vacías previas
    for (let i = 0; i < startingDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day empty';
      grid.appendChild(emptyCell);
    }

    const today = new Date();
    const todayFormatted = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    // Renderizar días del mes activo
    for (let day = 1; day <= lastDay.getDate(); day++) {
      const cell = document.createElement('div');
      cell.className = 'day';
      cell.innerText = day;

      const thisDate = new Date(displayedYear, displayedMonth, day);
      const dateStr = `${displayedYear}-${String(displayedMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

      // Comprobación de HOY
      if (thisDate.getTime() === todayFormatted.getTime()) {
        cell.classList.add('today');
      }

      // Comprobación de estado MARCADO
      if (records[dateStr]) {
        cell.classList.add('taken');
      }

      // Restricción de DÍAS FUTUROS vs PASADOS/ACTUAL
      if (thisDate.getTime() > todayFormatted.getTime()) {
        cell.classList.add('future');
      } else {
        cell.onclick = () => toggleDay(dateStr);
      }

      grid.appendChild(cell);
    }

    updateAlarmStatus();
  }

  function changeMonth(delta) {
    displayedMonth += delta;
    if (displayedMonth < 0) {
      displayedMonth = 11;
      displayedYear--;
    } else if (displayedMonth > 11) {
      displayedMonth = 0;
      displayedYear++;
    }
    initCalendar();
  }

  function toggleDay(dateStr) {
    if (records[dateStr]) {
      delete records[dateStr];
    } else {
      records[dateStr] = true;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    initCalendar();
  }

  function saveAlarm() {
    alarmTime = document.getElementById('alarmTime').value;
    localStorage.setItem(ALARM_KEY, alarmTime);
    
    if ("Notification" in window) {
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("Notificaciones activadas.");
        } else {
          alert("Permite las notificaciones para recibir las alertas.");
        }
        updateAlarmStatus();
      });
    } else {
      updateAlarmStatus();
    }
  }

  function updateAlarmStatus() {
    document.getElementById('alarmStatus').innerText = `Alarma programada: ${alarmTime} hs`;
  }

  function checkNotification() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;

    const now = new Date();
    const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

    if (currentHM === alarmTime && !records[todayStr]) {
      new Notification("Medicación Chicha", {
        body: "Aún no has marcado la dosis diaria de Chicha.",
        icon: "https://cdn-icons-png.flaticon.com/512/616/616408.png"
      });
    }
  }

  setInterval(checkNotification, 60000);
  initCalendar();
</script>
</body>
</html>
